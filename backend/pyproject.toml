[project]
name = "kards-backend"
version = "0.1.0"
description = "Kards — Corporate Volunteering & CSR Compliance SaaS API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "PyJWT>=2.10.0",
    "pwdlib[argon2]>=0.2.1",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "boto3>=1.35.0",
    "python-multipart>=0.0.12",
    "email-validator>=2.2.0",
    "reportlab>=4.2.0",
    "Pillow>=11.0.0",
    "aiohttp>=3.10.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
